    import { ETB_EFFECTS } from "./etb_effects.js";
    import { SPELL_EFFECTS } from "./spell_effects.js";

    import { DESTROY_EFFECTS } from "./destroy_effects.js";
    window.GAME_EFFECTS = { ETB_EFFECTS, SPELL_EFFECTS, ATTACK_TRIGGERS, DESTROY_EFFECTS };

<script type="text/babel">    const { useState, useEffect, useRef, useCallback, useMemo } = React;
const CARD_BACK = "./cards/bg.png";

// ================================================================
// CARD ABILITIES ENGINE
// ================================================================
const CardEngine = {
    isMono(manaZone, civ) {
        if (!manaZone || manaZone.length === 0) return false;
        return manaZone.every(m => m.civilizations?.includes(civ));
    },
    calculateCost(card, battleZone) {
        let cost = card.cost;
        if (!battleZone) return cost;
        const isSpell = this.isSpell(card);
        const isNature = card.civilizations?.includes('Nature');
        battleZone.forEach(c => {
            if (isSpell && c.name === "Essence Elf") cost = Math.max(1, cost - 1);
            if (!isSpell && isNature && c.name === "Elf-X") cost = Math.max(1, cost - 1);
        });
        return cost;
    },
    parseAbilities(card, battleZone, manaZone) {
        const text = (card.text || '').toLowerCase();
        const abilities = {};
        if (text.includes("can't attack players") || text.includes("can\u2019t attack players")) abilities.cantAttackPlayers = true;
        if (text.includes("can't attack.") || text.includes("can\u2019t attack.") || (text.includes("can't attack") && !text.includes("can't attack players") && !text.includes("can't attack untapped")))
            if (text.match(/this creature can't attack\b[^p]/i) || text.endsWith("can't attack.") || text.endsWith("can\u2019t attack."))
                abilities.cantAttack = true;
        if (text.includes("can't be blocked") || text.includes("can\u2019t be blocked")) abilities.cantBeBlocked = true;
        if (text.includes("can't be blocked by any creature that has power 3000 or less")) abilities.unblockableByWeak = true;
        if (text.match(/(^|\n|: |\. )([\w\-]+ )?blocker\b/)) abilities.blocker = true;
        if (text.match(/(^|\n|: |\. )([\w\-]+ )?slayer\b/)) abilities.slayer = true;
        if (text.match(/(^|\n|: |\. )([\w\-]+ )?double breaker\b/)) abilities.doubleBreaker = true;
        if (text.match(/(^|\n|: |\. )([\w\-]+ )?triple breaker\b/)) abilities.tripleBreaker = true;
        if (text.includes("attacks each turn if able")) abilities.mustAttack = true;
        if (text.includes("this creature can attack untapped creatures")) abilities.canAttackUntapped = true;
        if (text.includes("at the end of each of your turns, you may untap this creature")) abilities.untapAtEnd = true;
        if (text.includes("at the end of each of your turns, you may untap all your creatures")) abilities.untapAllAtEnd = true;
        if (text.includes("when this creature wins a battle, destroy it")) abilities.destroyOnWin = true;
        const paMatch = text.match(/power attacker \+(\d+)/);
        if (paMatch) abilities.powerAttacker = parseInt(paMatch[1]);
        if (text.trim().startsWith("shield trigger")) abilities.shieldTrigger = true;

        // --- DM-03 Dynamic Keywords ---
        if (card.name === "Angler Cluster") abilities.cantAttack = true;
        if (card.name === "Sparkle Flower" && this.isMono(manaZone, 'Light')) abilities.blocker = true;
        if (card.name === "Raging Dash-Horn" && this.isMono(manaZone, 'Nature')) abilities.doubleBreaker = true;

        // Sieg Balicula: Each of your other light creatures has "blocker"
        if (battleZone?.some(c => c.name === "Sieg Balicula, the Intense" && c.instanceId !== card.instanceId)) {
            if (card.civilizations?.includes('Light')) abilities.blocker = true;
        }

        return abilities;
    },
    isSpell(card) { return card.type === 'Spell'; },
    isEvolution(card) {
        const text = (card.text || '').toLowerCase();
        return text.includes("evolution") && text.includes("put on one of your");
    },
    evolutionBaitRace(card) {
        const text = (card.text || '').toLowerCase();
        const match = text.match(/put on one of your ([\w\s]+)\./);
        if (!match) return null;
        let race = match[1].trim();
        if (race.endsWith('s')) return race.slice(0, -1);
        return race;
    },
    basePower(card) { if (!card.power) return 0; return parseInt(card.power.toString().replace(/[^0-9]/g, '')) || 0; },
    getCurrentPower(card, battleZone, manaZone) {
        let power = this.basePower(card);
        if (!battleZone) return power;
        battleZone.forEach(other => {
            if (other.instanceId === card.instanceId) return;
            if (other.name === "Armored Blaster Valdios" && card.subtypes?.some(s => s.toLowerCase().includes('human'))) power += 1000;
            if (other.name === "Barkwhip, the Smasher" && other.isTapped && card.subtypes?.some(s => s.toLowerCase().includes('beast folk'))) power += 2000;
            if (other.name === "Stallob, the Oracle" && card.civilizations?.includes('Light')) power += 1000;
            if (other.name === "Smaragd, Vizier of Faith" && other.isTapped) power += 2000;
            if (other.name === "Ãœberdragon Jabaha" && card.civilizations?.includes('Fire')) power += 2000;
        });
        if (card.name === "Alek, Solidity Enforcer") {
            const lightCount = battleZone.filter(c => c.instanceId !== card.instanceId && c.civilizations?.includes('Light')).length;
            power += (lightCount * 1000);
        }
        if (card.name === "Garkago Dragon") {
            const fireCount = battleZone.filter(c => c.instanceId !== card.instanceId && c.civilizations?.includes('Fire')).length;
            power += (fireCount * 1000);
        }
        if (card.name === "Masked Pomegranate") {
            const natureCount = battleZone.filter(c => c.instanceId !== card.instanceId && c.civilizations?.includes('Nature')).length;
            power += (natureCount * 1000);
        }
        if (card.name === "Scratchclaw") {
            const darknessCount = battleZone.filter(c => c.instanceId !== card.instanceId && c.civilizations?.includes('Darkness')).length;
            power += (darknessCount * 1000);
        }
        if (card.name === "Angler Cluster" && this.isMono(manaZone, 'Water')) power += 3000;
        if (card.name === "Baby Zoppe" && this.isMono(manaZone, 'Fire')) power += 2000;
        if (card.name === "Mudman" && this.isMono(manaZone, 'Darkness')) power += 2000;
        if (card.name === "Raging Dash-Horn" && this.isMono(manaZone, 'Nature')) power += 3000;
        if (card.name === "Ur Pale, Seeker of Sunlight" && this.isMono(manaZone, 'Light')) power += 2000;
        if (card.name === "Leaping Tornado Horn") {
            const others = battleZone.filter(c => c.instanceId !== card.instanceId).length;
            power += (others * 1000);
        }
        if (card.name === "Galsaur") {
            const others = battleZone.filter(c => c.instanceId !== card.instanceId).length;
            if (others === 0) power += 4000;
        }
        return power;
    },
    getPotentialPower(card, battleZone, graveyard, manaZone) {
        let power = this.getCurrentPower(card, battleZone, manaZone);
        const abs = this.parseAbilities(card, battleZone, manaZone);
        if (abs.powerAttacker) power += abs.powerAttacker;
        if (card.name === "Bolshack Dragon" && graveyard) {
            const fireCount = graveyard.filter(c => c.civilizations?.includes('Fire')).length;
            power += (fireCount * 1000);
        }
        if (card.name === "Armored Cannon Balbaro") {
            const humans = battleZone.filter(c => c.instanceId !== card.instanceId && c.subtypes?.some(s => s.toLowerCase().includes('human'))).length;
            power += (humans * 2000);
        }
        if (card.name === "Dogarn, the Marauder") {
            const tapped = battleZone.filter(c => c.instanceId !== card.instanceId && c.isTapped).length;
            power += (tapped * 2000);
        }
        return power;
    },
    hasActiveGlobalEffect(card, battleZone) {
        const names = ["Essence Elf", "Elf-X", "Armored Blaster Valdios", "Barkwhip, the Smasher", "Stallob, the Oracle", "Smaragd, Vizier of Faith", "Ãœberdragon Jabaha", "Sieg Balicula, the Intense"];
        return names.includes(card.name);
    },
    attackPower(card, battleZone, graveyard, manaZone) {
        // Deprecated, use getPotentialPower for UI or actual battle resolve
        return this.getPotentialPower(card, battleZone, graveyard, manaZone);
    },
    hasAttackTrigger(card) {
        const text = (card.text || '').toLowerCase();
        return text.includes("whenever this creature attacks");
    },
    shieldsToBreak(card, battleZone, manaZone) {
        const abilities = this.parseAbilities(card, battleZone, manaZone);
        if (abilities.tripleBreaker) return 3;
        if (abilities.doubleBreaker) return 2;
        if (card.tempDoubleBreaker) return 2;

        if (card.name === "Galsaur" && battleZone) {
            const others = battleZone.filter(c => c.instanceId !== card.instanceId).length;
            if (others === 0) return 2;
        }

        return 1;
    },
    canAttackPlayer(card, battleZone, manaZone) {
        const abilities = this.parseAbilities(card, battleZone, manaZone);
        if (card.canAttackPlayersOverride) return true;
        if (abilities.cantAttack) return false;
        if (abilities.cantAttackPlayers) return false;
        return true;
    },
    canAttack(card, battleZone, opponentBattleZone, manaZone) {
        const abilities = this.parseAbilities(card, battleZone, manaZone);
        if (abilities.cantAttack) return false;

        // Snip Striker Bullraizer: can't attack while opponent has more creatures
        if (card.name === "Snip Striker Bullraizer") {
            if (opponentBattleZone && opponentBattleZone.length > battleZone.length) return false;
        }

        return true;
    },
    canAttackUntapped(card, battleZone, manaZone) { return !!this.parseAbilities(card, battleZone, manaZone).canAttackUntapped || !!card.canAttackUntappedThisTurn; },
    canBeBlocked(atk, def, atkContext, defContext) {
        const abs = this.parseAbilities(atk, atkContext.battleZone, atkContext.manaZone);
        if (abs.cantBeBlocked || atk.cantBeBlockedThisTurn) return false;

        // Legendary Bynor: Your other water creatures can't be blocked
        if (atkContext.battleZone?.some(c => c.name === "Legendary Bynor" && c.instanceId !== atk.instanceId)) {
            if (atk.civilizations?.includes('Water')) return false;
        }

        // Threshold-based unblockable
        const defPower = this.getCurrentPower(def, defContext.battleZone, defContext.manaZone) + (def.powerBonus || 0);
        if (atk.name === "Xeno Mantis" && defPower <= 5000) return false;
        if (atk.name === "Stampeding Longhorn" && defPower <= 3000) return false;
        if (atk.name === "Masked Pomegranate" && defPower <= 4000) return false;

        // Tropico: Can't be blocked while you have 2+ other creatures
        if (atk.name === "Tropico") {
            const others = atkContext.battleZone.filter(c => c.instanceId !== atk.instanceId).length;
            if (others >= 2) return false;
        }

        // King Nautilus: Your other Liquid People can't be blocked
        const hasNautilus = atkContext.battleZone.some(c => c.name === "King Nautilus" && c.instanceId !== atk.instanceId);
        if (hasNautilus && atk.subtypes?.some(s => s.toLowerCase().includes('liquid people'))) return false;

        return true;
    },
    hasSlayer(card) { return this.parseAbilities(card, [], []).slayer; },
    onDestroyed(card, battleZone) {
        const text = (card.text || '').toLowerCase();

        // Mandatory replacements (DM-03)
        if (text.includes("add it to your shields face down instead") || text.includes("add it to your shields instead")) return 'shield';
        if (text.includes("put it into your mana zone instead") && !text.includes("you may")) return 'mana';
        if (text.includes("return it to your hand instead") && !text.includes("you may")) return 'hand';

        // Passive replacements from others (DM-03) - Gigamantis is mandatory for OTHER units
        if (battleZone) {
            if (battleZone.some(c => c.name === "Gigamantis") && card.civilizations?.includes('Nature') && card.name !== "Gigamantis") {
                return 'mana';
            }
        }

        // Legacy Set 1/2 logic (assuming mandatory if no "may")
        if (text.includes("when this creature would be destroyed, put it into your mana zone")) return 'mana';
        if (text.includes("when this creature would be destroyed, put it into your hand") || text.includes("when this creature would be destroyed, return it to your hand")) return 'hand';

        return 'graveyard';
    },
    getOptionalReplacement(card, battleZone) {
        const text = (card.text || '').toLowerCase();
        if (card.name === "Gigastand") {
            return { type: 'hand', message: "Return Gigastand to hand? (Must discard 1 card)", requiresDiscard: true };
        }
        if (battleZone?.some(c => c.name === "Jack Viper, Shadow of Doom") && card.civilizations?.includes('Darkness') && card.name !== "Jack Viper, Shadow of Doom") {
            return { type: 'hand', message: "Jack Viper: Return Darkness creature to hand instead?", requiresDiscard: false };
        }
        return null;
    }
};

/* ============ TOAST ============ */
const Toast = ({ t }) => {
    const [exit, setExit] = useState(false);
    useEffect(() => { const tm = setTimeout(() => setExit(true), 1700); return () => clearTimeout(tm); }, []);
    return <div className={`toast-msg toast-msg--${t.type} ${exit ? 'toast-msg--exit' : ''}`}>{t.message}</div>;
};

/* ============ PREVIEW ============ */
const Preview = ({ card }) => {
    if (!card) return null;
    const src = card.isFaceDown ? CARD_BACK : `./cards/${card.set_id || 'dm-01'}/${card.image_file}`;
    const abs = CardEngine.parseAbilities(card);
    const abilityTags = [];
    if (abs.blocker) abilityTags.push("Blocker");
    if (abs.doubleBreaker || card.tempDoubleBreaker) abilityTags.push("Double Breaker");
    if (abs.slayer) abilityTags.push("Slayer");
    if (abs.powerAttacker) abilityTags.push(`Power Attacker +${abs.powerAttacker}`);
    if (abs.cantAttackPlayers) abilityTags.push("Can't Attack Players");
    if (abs.cantAttack) abilityTags.push("Can't Attack");
    if (abs.cantBeBlocked) abilityTags.push("Unblockable");
    if (abs.shieldTrigger) abilityTags.push("Shield Trigger");
    if (abs.canAttackUntapped) abilityTags.push("Attacks Untapped");
    if (abs.untapAtEnd) abilityTags.push("End-Turn Untap");
    if (abs.untapAllAtEnd) abilityTags.push("End-Turn Untap All");
    if (abs.destroyOnWin) abilityTags.push("Destroy on Win");

    const civColors = {
        'Fire': 'var(--fire)',
        'Water': 'var(--ice)',
        'Nature': 'var(--nature)',
        'Darkness': 'var(--shadow)',
        'Light': 'var(--gold-bright)'
    };

    return (
        <div className="preview">
            <div className="preview-frame">
                <img src={src} alt={card.name || ""} />
                {!card.isFaceDown && (
                    <div className="preview-meta">
                        <div style={{display:'flex', justifyContent:'space-between', opacity:0.5, fontSize:11, fontWeight:900, marginBottom:4}}>
                            <span>{card.id}</span>
                            <span>{card.rarity}</span>
                        </div>
                        <h3>{card.name}</h3>
                        <div className="stats">
                            {card.type && <em style={{color:'var(--fire-soft)'}}>{card.type}</em>}
                            {card.cost != null && <>&nbsp;| Cost: <em>{card.cost}</em></>}
                            {card.power && <>&nbsp;| Power: <em>{card.power}</em></>}
                        </div>

                        {card.subtypes && card.subtypes.length > 0 && (
                            <div style={{display:'flex', flexWrap:'wrap', gap:4, justifyContent:'center', marginTop:10}}>
                                {card.subtypes.map((s, i) => (
                                    <span key={i} style={{fontSize:10,fontWeight:900,padding:'2px 8px',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.2)',borderRadius:100,color:'var(--cream)',textTransform:'uppercase'}}>{s}</span>
                                ))}
                            </div>
                        )}

                        {card.civilizations && (
                            <div style={{display:'flex', flexWrap:'wrap', gap:4, justifyContent:'center', marginTop:6}}>
                                {card.civilizations.map((c, i) => (
                                    <span key={i} style={{fontSize:9,fontWeight:900,padding:'1px 8px',background:'rgba(0,0,0,0.3)',border:`1px solid ${civColors[c] || '#fff'}`,borderRadius:4,color:civColors[c] || '#fff',textTransform:'uppercase'}}>{c}</span>
                                ))}
                            </div>
                        )}

                        {abilityTags.length > 0 && (
                            <div style={{display:'flex', flexWrap:'wrap', gap:3, justifyContent:'center', marginTop:10}}>
                                {abilityTags.map((tag, i) => (
                                    <span key={i} style={{fontSize:8,fontWeight:800,padding:'2px 6px',background:'rgba(255,214,68,0.1)',border:'1px solid rgba(255,214,68,0.2)',borderRadius:4,color:'var(--gold)',textTransform:'uppercase',letterSpacing:'0.05em'}}>{tag}</span>
                                ))}
                            </div>
                        )}

                        {card.text && <div className="desc" style={{marginTop:15, borderTop:'1px solid rgba(255,255,255,0.05)', paddingTop:10}}>{card.text}</div>}
                        {card.flavor && <div style={{fontSize:11, fontStyle:'italic', opacity:0.4, marginTop:10, lineHeight:1.3}}>"{card.flavor}"</div>}
                    </div>
                )}
            </div>
        </div>
    );
};

/* ============ CONTEXT MENU ============ */
const CtxMenu = ({ menu, onClose, onAction }) => {
    if (!menu) return null;
    const st = { left: Math.min(menu.x, window.innerWidth - 240), top: Math.min(menu.y, window.innerHeight - 300) };
    return (
        <>
            <div className="ctx-backdrop" onClick={onClose} onContextMenu={e => { e.preventDefault(); onClose(); }} />
            <div className="ctx-menu" style={st}>
                {menu.items.map((it, i) => {
                    if (it.type === 'sep') return <div key={i} className="ctx-sep" />;
                    return (
                        <button key={i} className={`ctx-item ${it.cls||''}`}
                                onClick={e => { e.stopPropagation(); onAction(it.action, it.data); onClose(); }}>
                            {it.icon && <span style={{ fontSize: 15 }}>{it.icon}</span>}
                            {it.label}
                        </button>
                    );
                })}
            </div>
        </>
    );
};

/* ============ NETWORK ============ */
function useNetwork(conn) {
    const handlers = useRef({});
    const pending = useRef(null);
    const on = useCallback((t, h) => { handlers.current[t] = h; }, []);
    const send = useCallback((t, p) => { if (conn?.open) conn.send({ type: t, payload: p, ts: Date.now() }); }, [conn]);
    const sync = useCallback((g) => {
        if (pending.current) clearTimeout(pending.current);
        pending.current = setTimeout(() => {
            const s = typeof g === 'function' ? g() : g;
            send("SYNC", s);
            pending.current = null;
        }, 50); // Small 50ms debounce
    }, [send]);
    useEffect(() => {
        if (!conn) return;
        const h = d => { const fn = handlers.current[d.type]; if (fn) fn(d.payload); };
        conn.on('data', h);
        return () => {
            conn.off('data', h);
            if (pending.current) clearTimeout(pending.current);
        };
    }, [conn]);
    return useMemo(() => ({ on, send, sync }), [on, send, sync]);
}

/* ============ DRAG ============ */
function useDrag(onDrop) {
    const [dragging, setDragging] = useState(null);
    const start = useCallback((e, card) => {
        if (e.button !== 0) return;
        e.preventDefault();
        const r = e.currentTarget.getBoundingClientRect();
        const ox = e.clientX - r.left, oy = e.clientY - r.top;
        setDragging({ card, x: e.clientX - ox, y: e.clientY - oy, w: r.width, h: r.height });
        const mv = ev => { ev.preventDefault(); setDragging(p => p ? { ...p, x: ev.clientX - ox, y: ev.clientY - oy } : null); };
        const up = ev => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); onDrop(card, { x: ev.clientX, y: ev.clientY }); setDragging(null); };
        document.addEventListener('mousemove', mv);
        document.addEventListener('mouseup', up);
    }, [onDrop]);
    return { dragging, start };
}

/* ============ ARROW DRAG (Hearthstone-style) ============ */
function useArrowDrag(onArrowDrop) {
    const [arrow, setArrow] = useState(null);
    const startArrow = useCallback((e, card) => {
        if (e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        const r = e.currentTarget.getBoundingClientRect();
        const sx = r.left + r.width / 2, sy = r.top + r.height / 2;
        setArrow({ card, sx, sy, ex: e.clientX, ey: e.clientY });
        const mv = ev => { ev.preventDefault(); setArrow(p => p ? { ...p, ex: ev.clientX, ey: ev.clientY } : null); };
        const up = ev => {
            document.removeEventListener('mousemove', mv);
            document.removeEventListener('mouseup', up);
            onArrowDrop(card, { x: ev.clientX, y: ev.clientY });
            setArrow(null);
        };
        document.addEventListener('mousemove', mv);
        document.addEventListener('mouseup', up);
    }, [onArrowDrop]);
    return { arrow, startArrow };
}

/* ============ ARROW SVG ============ */
const ArrowOverlay = ({ arrow }) => {
    if (!arrow) return null;
    const { sx, sy, ex, ey } = arrow;
    const dx = ex - sx, dy = ey - sy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 10) return null;
    const mx = sx + dx * 0.5, my = sy + dy * 0.5 - Math.min(dist * 0.2, 80);
    const angle = Math.atan2(ey - my, ex - mx);
    const aSize = 30; // Bigger arrowhead
    const a1x = ex - aSize * Math.cos(angle - 0.5), a1y = ey - aSize * Math.sin(angle - 0.5);
    const a2x = ex - aSize * Math.cos(angle + 0.5), a2y = ey - aSize * Math.sin(angle + 0.5);
    return (
        <div className="arrow-overlay">
            <svg>
                <defs>
                    <filter id="arrow-glow">
                        <feGaussianBlur stdDeviation="5" result="blur" />
                        <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
                    </filter>
                </defs>
                <path d={`M ${sx} ${sy} Q ${mx} ${my} ${ex} ${ey}`}
                      fill="none" stroke="#ff5722" strokeWidth="16" strokeLinecap="round"
                      filter="url(#arrow-glow)" opacity="0.9" />
                <path d={`M ${sx} ${sy} Q ${mx} ${my} ${ex} ${ey}`}
                      fill="none" stroke="#ffab91" strokeWidth="6" strokeLinecap="round" opacity="0.6" />
                <polygon points={`${ex},${ey} ${a1x},${a1y} ${a2x},${a2y}`}
                         fill="#ff5722" stroke="#ffab91" strokeWidth="2" filter="url(#arrow-glow)" />
                <circle cx={sx} cy={sy} r="12" fill="rgba(255,87,34,0.3)" stroke="#ff5722" strokeWidth="4" />
            </svg>
        </div>
    );
};

/* ============ GAME BOARD ============ */
const GameBoard = ({ cards, deck, conn, isHost }) => {
    const [gs, setGs] = useState({
        hand: [], mana: [], battleZone: [], shields: [], deck: [], graveyard: [],
        opponent: { handCount: 0, mana: [], battleZone: [], shields: [null, null, null, null, null], graveyard: [] },
        turn: isHost, hasPlacedMana: false, attackStarted: false, gameOver: null,
        turnEffects: { creepingPlague: false }
    });
    const [toasts, setToasts] = useState([]);
    const [ctx, setCtx] = useState(null);
    const [preview, setPreview] = useState(null);
    const [trigger, setTrigger] = useState(null);
    const [targeting, setTargeting] = useState(null);
    const [blockingRequest, setBlockingRequest] = useState(null);
    const [waitingForBlock, setWaitingForBlock] = useState(null);
    const [waitingForOpponent, setWaitingForOpponent] = useState(false);
    const [searchingDeck, setSearchingDeck] = useState(null);
    const [pendingDestruction, setPendingDestruction] = useState(null);
    const [pendingDecision, setPendingDecision] = useState(null);
    const [logs, setLogs] = useState([]);
    const [showHistory, setShowHistory] = useState(false);

    const prevT = useRef(null);
    const wfbR = useRef(null);
    wfbR.current = waitingForBlock;
    const wfoR = useRef(null);
    wfoR.current = waitingForOpponent;
    const gsR = useRef(gs);
    gsR.current = gs;
    const net = useNetwork(conn);

    const toast = useCallback((msg, type = "info") => {
        const id = Date.now() + Math.random();
        setToasts(p => [...p, { id, message: msg, type }]);
        setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 2200);
    }, []);

    const cancelTargeting = useCallback(() => setTargeting(null), []);

    const onTargetClick = useCallback((target) => {
        if (!targeting) return;
        const newSelected = [...(targeting.selected || []), target.instanceId];
        if (newSelected.length >= targeting.count) {
            targeting.onComplete(newSelected);
            setTargeting(null);
        } else {
            setTargeting({ ...targeting, selected: newSelected });
        }
    }, [targeting]);

    const hover = useCallback(c => { if (prevT.current) clearTimeout(prevT.current); prevT.current = setTimeout(() => setPreview(c), 300); }, []);
    const unhover = useCallback(() => { if (prevT.current) clearTimeout(prevT.current); prevT.current = null; setPreview(null); }, []);

    const isLocked = !gs.turn || gs.gameOver || waitingForOpponent || !!waitingForBlock || !!searchingDeck || !!targeting || !!pendingDestruction || !!pendingDecision || !!trigger;

    const addLog = useCallback((text, type = 'info', isOpponent = false, card = null) => {
        const entry = {
            id: Date.now() + Math.random(),
            text,
            type,
            isOpponent,
            card: card ? { name: card.name, image_file: card.image_file, set_id: card.set_id, text: card.text, type: card.type, power: card.power, cost: card.cost, civilizations: card.civilizations, subtypes: card.subtypes } : null,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
        };
        setLogs(p => [entry, ...p]);
        if (!isOpponent) {
            net.send("ACTION", { action: "LOG_ENTRY", details: entry });
        }
    }, [net]);

    const triggerEffect = useCallback((mapName, card) => {
        const map = window.GAME_EFFECTS?.[mapName];
        if (!map) return;
        const fx = map[card.name];
        if (fx) {
            addLog(`Triggered: ${card.name}`, 'effect', false, card);
            const params = {
                card, draw, setGs, toast, net, setSearchingDeck, setTargeting, gsR, play, attack, CardEngine,
                addLog,
                askMay: ({ message, onYes, onNo }) => {
                    setPendingDecision({ card, message, onYes, onNo: onNo || (() => {}) });
                }
            };
            setTimeout(() => fx(params), 400);
        }
    }, [draw, net, play, attack, toast, addLog]);

    const finishDestruction = useCallback((card, destinationOverride = null) => {
        setGs(p => {
            const target = p.battleZone.find(c => c.instanceId === card.instanceId);
            if (!target) return p;

            const dest = destinationOverride || CardEngine.onDestroyed(target, p.battleZone);
            const filtered = p.battleZone.filter(c => c.instanceId !== card.instanceId);

            if (dest === 'mana') {
                return { ...p, battleZone: filtered, mana: [...p.mana, { ...target, isTapped: false }] };
            }
            if (dest === 'shield') {
                return { ...p, battleZone: filtered, shields: [...p.shields, target] };
            }
            if (dest === 'hand') {
                return { ...p, battleZone: filtered, hand: [...p.hand, target] };
            }
            return { ...p, battleZone: filtered, graveyard: [...p.graveyard, target] };
        });
        net.send("ACTION", { action: "FINISH_DESTRUCTION_SYNC", details: { instanceId: card.instanceId, dest: destinationOverride || CardEngine.onDestroyed(card, gsR.current.battleZone) } });
    }, [net]);



    useEffect(() => {
        const isMakingDecision = !!targeting || !!blockingRequest || !!trigger || !!searchingDeck || !!pendingDestruction || !!pendingDecision;
        net.send("ACTION", { action: "WAIT_OPPONENT", details: { waiting: isMakingDecision } });
    }, [!!targeting, !!blockingRequest, !!trigger, !!searchingDeck, !!pendingDestruction, !!pendingDecision]);

    const broadcast = useCallback(s => {
        net.sync({
            handCount: s.hand.length,
            mana: s.mana.map(c => ({ instanceId: c.instanceId, isTapped: !!c.isTapped, skipNextUntap: !!c.skipNextUntap, civilizations: c.civilizations, name: c.name, image_file: c.image_file, set_id: c.set_id })),
            battleZone: s.battleZone.map(c => ({ instanceId: c.instanceId, name: c.name, power: c.power, cost: c.cost, civilizations: c.civilizations, image_file: c.image_file, set_id: c.set_id, isTapped: !!c.isTapped, skipNextUntap: !!c.skipNextUntap, chaosStrikeTarget: !!c.chaosStrikeTarget, text: c.text, type: c.type, subtypes: c.subtypes, powerBonus: c.powerBonus || 0, tempDoubleBreaker: c.tempDoubleBreaker })),
            shields: s.shields.map(c => ({ instanceId: c.instanceId, name: c.name, image_file: c.image_file, set_id: c.set_id, text: c.text, type: c.type, subtypes: c.subtypes })),
            graveyard: s.graveyard.map(c => ({ instanceId: c.instanceId, name: c.name, civilizations: c.civilizations, image_file: c.image_file, set_id: c.set_id })),
        });
    }, [net]);

    useEffect(() => { broadcast(gs); }, [gs.hand.length, gs.mana, gs.battleZone, gs.shields.length, gs.graveyard.length, broadcast]);

    const draw = useCallback(() => {
        setGs(p => {
            if (p.deck.length === 0) { net.send("ACTION", { action: "DECK_OUT" }); return { ...p, gameOver: 'lose' }; }
            const d = [...p.deck]; const c = d.pop();
            return { ...p, hand: [...p.hand, c], deck: d };
        });
    }, [net]);

    useEffect(() => {
        const full = [];
        deck.cards.forEach(dc => {
            const info = cards.find(c => c.id === dc.id && (!dc.set_id || c.set_id === dc.set_id));
            if (!info) return;
            for (let i = 0; i < dc.count; i++) full.push({ ...info, instanceId: Math.random().toString(36).substr(2, 9) });
        });
        const sh = full.sort(() => Math.random() - 0.5);
        const shields = sh.splice(0, 5);
        setGs(p => ({ ...p, deck: sh, shields }));
        for (let i = 0; i < 5; i++) setTimeout(() => draw(), 500 + i * 200);
    }, []);

    const play = useCallback((card, target, targetId) => {
        if (isLocked) return;

        // Calculate dynamic cost reduction
        let actualCost = card.cost;
        const isSpell = CardEngine.isSpell(card);
        const isNature = card.civilizations?.includes('Nature');

        gs.battleZone.forEach(c => {
            if (isSpell && c.name === "Essence Elf") actualCost = Math.max(1, actualCost - 1);
            if (!isSpell && isNature && c.name === "Elf-X") actualCost = Math.max(1, actualCost - 1);
        });

        if (target === "battle" || target === "evolution") {
            const s = gsR.current;
            const ut = s.mana.filter(m => !m.isTapped);
            if (ut.length < actualCost) { toast("Not enough mana", "error"); return; }
            if (!ut.some(m => m.civilizations.some(c => card.civilizations.includes(c)))) { toast(`Need ${card.civilizations[0]} mana`, "error"); return; }

            setGs(p => {
                let remainingToPay = actualCost;
                const nm = p.mana.map(m => { if (!m.isTapped && remainingToPay > 0) { remainingToPay--; return { ...m, isTapped: true }; } return m; });

                if (isSpell) {
                    addLog(`Cast Spell: ${card.name}`, 'spell', false, card);
                    return { ...p, hand: p.hand.filter(c => c.instanceId !== card.instanceId), mana: nm, graveyard: [...p.graveyard, card] };
                }

                if (target === "evolution") {
                    addLog(`Evolved: ${card.name}`, 'summon', false, card);
                    const bait = p.battleZone.find(c => c.instanceId === targetId);
                    const filteredBz = p.battleZone.filter(c => c.instanceId !== targetId);
                    // Inherit tapped state and summoning sickness
                    const newEvo = { ...card, summonedThisTurn: bait.summonedThisTurn, isTapped: bait.isTapped, powerBonus: 0 };
                    return {
                        ...p,
                        hand: p.hand.filter(c => c.instanceId !== card.instanceId),
                        mana: nm,
                        battleZone: [...filteredBz, newEvo],
                        graveyard: [...p.graveyard, bait]
                    };
                }

                addLog(`Summoned: ${card.name}`, 'summon', false, card);
                return { ...p, hand: p.hand.filter(c => c.instanceId !== card.instanceId), mana: nm, battleZone: [...p.battleZone, { ...card, summonedThisTurn: true, isTapped: false, powerBonus: 0 }] };
            });
            if (isSpell) {
                triggerEffect("SPELL_EFFECTS", card);
                toast(`${card.name} cast!`);
            } else {
                triggerEffect("ETB_EFFECTS", card);
                toast(`${card.name} ${target === 'evolution' ? 'evolved' : 'summoned'}!`);
            }
        } else {
            setGs(p => ({ ...p, hasPlacedMana: true, hand: p.hand.filter(c => c.instanceId !== card.instanceId), mana: [...p.mana, { ...card, isTapped: false }] }));
            addLog(`Charged Mana: ${card.name}`, 'mana', false, card);
            toast("Mana charged");
        }
        setCtx(null);
    }, [toast, net, draw, isLocked, triggerEffect]);

    const resolveAttack = useCallback((atk, tgt, tid, isBlocked) => {
        if (tgt === "SHIELD") {
            addLog(`${atk.name} attacked shields`, 'attack', false, atk);
            if (!CardEngine.canAttackPlayer(atk, gsR.current.battleZone, gsR.current.mana)) { toast("Can't attack players!", "error"); return; }
            const shieldsToBreak = CardEngine.shieldsToBreak(atk, gsR.current.battleZone);
            const oppShields = gsR.current.opponent.shields;
            const oppShieldCount = Array.isArray(oppShields) ? oppShields.length : oppShields;
            if (oppShieldCount === 0) {
                toast("Direct attack!");
                net.send("ACTION", { action: "DIRECT_KILL" });
                setGs(p => ({ ...p, gameOver: 'win' }));
            } else {
                const actualBreaks = Math.min(shieldsToBreak, oppShieldCount);
                for (let i = 0; i < actualBreaks; i++) setTimeout(() => { net.send("ACTION", { action: "SHIELD_BROKEN" }); }, i * 400);
                toast(`Breaking ${actualBreaks} shield${actualBreaks > 1 ? 's' : ''}!`);
            }

            if (atk.name === "Marrow Ooze, the Twister") {
                setTimeout(() => {
                    setGs(p => {
                        const target = p.battleZone.find(x => x.instanceId === atk.instanceId);
                        if (!target) return p;
                        return { ...p, battleZone: p.battleZone.filter(x => x.instanceId !== atk.instanceId), graveyard: [...p.graveyard, target] };
                    });
                    toast("Marrow Ooze destroyed after attack!");
                }, 500);
            }
        } else {
            const opp = gsR.current.opponent.battleZone.find(c => c.instanceId === tid);
            if (!opp) return;
            addLog(`${atk.name} attacked ${opp.name}`, 'attack', false, atk);

            const s = gsR.current;
            const atkPower = CardEngine.getPotentialPower(atk, s.battleZone, s.graveyard, s.mana) + (atk.powerBonus || 0);
            const defPower = CardEngine.getCurrentPower(opp, s.opponent.battleZone, s.opponent.mana) + (opp.powerBonus || 0);

            const win = atkPower > defPower;
            const lose = atkPower < defPower;
            const tie = atkPower === defPower;
            const attackerHasSlayer = CardEngine.hasSlayer(atk) || (isBlocked && gsR.current.turnEffects.creepingPlague);

            // Handle Defender Destruction
            if (win || tie || attackerHasSlayer) {
                addLog(`${opp.name} was destroyed`, 'battle', false, opp);
                net.send("ACTION", { action: "CREATURE_DESTROYED", details: { targetId: tid } });
                if (attackerHasSlayer && !win && !tie) toast("Slayer: Enemy destroyed!", "error");
            }

            // Handle Attacker Destruction
            if (lose || tie || CardEngine.hasSlayer(opp)) {
                addLog(`${atk.name} was destroyed`, 'battle', false, atk);
                setTimeout(() => {
                    const target = gsR.current.battleZone.find(x => x.instanceId === atk.instanceId);
                    if (!target) return;

                    triggerEffect("DESTROY_EFFECTS", target);

                    const opt = CardEngine.getOptionalReplacement(target, gsR.current.battleZone);
                    if (opt) {
                        setPendingDestruction({ card: target, replacement: opt });
                    } else {
                        finishDestruction(target);
                    }

                    if (CardEngine.hasSlayer(opp) && !lose && !tie) toast("Slayer: Attacker destroyed!", "error");
                }, 100);
            }

            if (isBlocked && opp.name === "Spiral Grass") {
                setTimeout(() => net.send("ACTION", { action: "UNTAP_TARGET", details: { targetId: tid } }), 600);
            }

            if (tie) toast("Tie! Both destroyed!", "error");
            else if (win) toast(`${atk.name} wins battle!`);
            else if (lose) toast(`${atk.name} loses battle!`, "error");
        }
    }, [net, toast, triggerEffect]);

    const attack = useCallback((atk, tgt, tid) => {
        if (isLocked) return;
        if (atk.summonedThisTurn) { toast("Summoning sickness!", "error"); return; }
        if (atk.isTapped) { toast("Already tapped", "error"); return; }
        if (!CardEngine.canAttack(atk, gsR.current.battleZone, gsR.current.opponent.battleZone, gsR.current.mana)) { toast("This creature can't attack!", "error"); return; }

        addLog(`${atk.name} is attacking!`, 'attack', false, atk);
        setGs(p => ({ ...p, attackStarted: true, battleZone: p.battleZone.map(c => c.instanceId === atk.instanceId ? { ...c, isTapped: true } : c) }));

        // Trigger "Whenever this creature attacks" effects
        triggerEffect("ATTACK_TRIGGERS", atk);

        // Notify opponent to allow blocking
        net.send("ACTION", { action: "ATTACK_DECLARED", details: { attacker: atk, targetType: tgt, targetId: tid } });
        setWaitingForBlock({ atk, tgt, tid });
    }, [toast, net, isLocked, triggerEffect]);

    const endTurn = useCallback(() => {
        if (isLocked) return;

        const currentGs = gsR.current;
        const mandatoryAtk = currentGs.battleZone.find(c => {
            const abs = CardEngine.parseAbilities(c, currentGs.battleZone, currentGs.mana);
            const canAtk = CardEngine.canAttack(c, currentGs.battleZone, currentGs.opponent.battleZone, currentGs.mana);
            const canAtkShields = CardEngine.canAttackPlayer(c, currentGs.battleZone, currentGs.mana);
            const hasTappedOpps = currentGs.opponent.battleZone.some(x => x.isTapped);
            const canAtkUntapped = CardEngine.canAttackUntapped(c, currentGs.battleZone, currentGs.mana);
            const hasUntappedOpps = currentGs.opponent.battleZone.some(x => !x.isTapped);

            return abs.mustAttack && !c.isTapped && !c.summonedThisTurn && canAtk &&
                (canAtkShields || hasTappedOpps || (canAtkUntapped && hasUntappedOpps));
        });

        if (mandatoryAtk) {
            toast(`${mandatoryAtk.name} must attack!`, "error");
            // Default to shield attack if possible, otherwise pick first valid creature
            if (CardEngine.canAttackPlayer(mandatoryAtk, currentGs.battleZone, currentGs.mana)) {
                attack(mandatoryAtk, "SHIELD");
            } else {
                const tappedOpps = currentGs.opponent.battleZone.filter(x => x.isTapped);
                if (tappedOpps.length > 0) {
                    attack(mandatoryAtk, "CREATURE", tappedOpps[0].instanceId);
                } else if (CardEngine.canAttackUntapped(mandatoryAtk, currentGs.battleZone, currentGs.mana)) {
                    const untapped = currentGs.opponent.battleZone.find(x => !x.isTapped);
                    if (untapped) attack(mandatoryAtk, "CREATURE", untapped.instanceId);
                }
            }
            return;
        }

        setGs(p => {
            const untapAll = p.battleZone.some(c => CardEngine.parseAbilities(c, p.battleZone, p.mana).untapAllAtEnd);
            const newBz = p.battleZone.map(c => {
                const abs = CardEngine.parseAbilities(c, p.battleZone, p.mana);
                const reset = { ...c, powerBonus: 0, cantBeBlockedThisTurn: false, tempDoubleBreaker: false, chaosStrikeTarget: false, canAttackUntappedThisTurn: false, canAttackPlayersOverride: false };
                if (untapAll || abs.untapAtEnd) return { ...reset, isTapped: false };
                return reset;
            });
            return {
                ...p,
                turn: false,
                attackStarted: false,
                battleZone: newBz,
                turnEffects: { creepingPlague: false }
            };
        });
        addLog("End of Turn", 'info');
        net.send("END_TURN");
        toast("Turn ended");
    }, [net, toast, isLocked, attack]);

    useEffect(() => {
        net.on("SYNC", p => setGs(prev => ({ ...prev, opponent: p })));
        net.on("END_TURN", () => {
            setGs(p => ({
                ...p,
                turn: true,
                hasPlacedMana: false,
                attackStarted: false,
                mana: p.mana.map(c => c.skipNextUntap ? { ...c, skipNextUntap: false } : { ...c, isTapped: false }),
                battleZone: p.battleZone.map(c => {
                    // Check for 'frozen' state (Fonch) or standard skipNextUntap
                    if (c.frozen) return { ...c, isTapped: true, frozen: false };
                    const nextIsTapped = c.skipNextUntap ? true : false;
                    return {
                        ...c,
                        isTapped: nextIsTapped,
                        skipNextUntap: false,
                        summonedThisTurn: false,
                        powerBonus: 0,
                        cantBeBlockedThisTurn: false,
                        tempDoubleBreaker: false,
                        chaosStrikeTarget: false,
                        canAttackUntappedThisTurn: false,
                        canAttackPlayersOverride: false
                    };
                })
            }));
            setTimeout(() => draw(), 300);
            toast("Your turn!");
        });

        net.on("ACTION", p => {
            const { action, details } = p;
            if (action === "LOG_ENTRY") {
                setLogs(p => [{ ...details, isOpponent: true }, ...p]);
            }
            if (action === "MOVE_TO_DECK_TOP") {
                setGs(p => {
                    const target = p.battleZone.find(c => c.instanceId === details.targetId);
                    if (!target) return p;
                    return {
                        ...p,
                        battleZone: p.battleZone.filter(c => c.instanceId !== details.targetId),
                        deck: [...p.deck, target] // target goes to top (end of array)
                    };
                });
                toast("Creature returned to top of deck!", "error");
            }
            if (action === "FREEZE_TARGET") {
                setGs(p => ({
                    ...p,
                    battleZone: p.battleZone.map(c => c.instanceId === details.targetId ? { ...c, isTapped: true, frozen: true } : c)
                }));
                toast("Creature frozen!", "error");
            }
            if (action === "ATTACK_DECLARED") {
                const { attacker, targetType, targetId } = details;
                const blockers = gsR.current.battleZone.filter(c => {
                    const abs = CardEngine.parseAbilities(c, gsR.current.battleZone, gsR.current.mana);
                    // Contexts from player's view: attacker side is opponent, defender side is player
                    const atkCtx = { battleZone: gsR.current.opponent.battleZone, manaZone: gsR.current.opponent.mana };
                    const defCtx = { battleZone: gsR.current.battleZone, manaZone: gsR.current.mana };
                    return abs.blocker && !c.isTapped && CardEngine.canBeBlocked(attacker, c, atkCtx, defCtx);
                });

                if (blockers.length === 0) {
                    net.send("ACTION", { action: "BLOCK_DECISION", details: { blockerId: null } });
                } else {
                    setBlockingRequest({ attacker, targetType, targetId, blockers });
                    setTargeting({
                        message: "Incoming Attack! Select a blocker or Pass.",
                        count: 1,
                        validTargets: blockers.map(b => b.instanceId),
                        onComplete: (ids) => {
                            const bId = ids[0];
                            setGs(s => ({ ...s, battleZone: s.battleZone.map(c => c.instanceId === bId ? { ...c, isTapped: true, skipNextUntap: true } : c) }));
                            net.send("ACTION", { action: "BLOCK_DECISION", details: { blockerId: bId } });
                            setBlockingRequest(null);
                        }
                    });
                }
            }
            if (action === "BLOCK_DECISION") {
                const { blockerId } = details;
                const wfb = wfbR.current;
                if (!wfb) return;
                setWaitingForBlock(null);
                if (blockerId) {
                    const blocker = gsR.current.opponent.battleZone.find(x => x.instanceId === blockerId);
                    addLog(`${blocker ? blocker.name : 'A creature'} blocked the attack!`, 'battle', true, blocker);
                    resolveAttack(wfb.atk, "CREATURE", blockerId, true);
                } else {
                    resolveAttack(wfb.atk, wfb.tgt, wfb.tid, false);
                }
            }
            if (action === "WAIT_OPPONENT") {
                setWaitingForOpponent(details.waiting);
            }
            if (action === "REVEAL_CARD") {
                toast(`${details.card.name} revealed by opponent!`);
                setSearchingDeck({
                    message: "OPPONENT REVEALED:",
                    count: 0,
                    filter: () => false,
                    isReveal: true,
                    card: details.card,
                    onComplete: () => {}
                });
                setTimeout(() => setSearchingDeck(null), 3500);
            }
            if (action === "SHIELD_BROKEN") {
                addLog("One of your shields was broken", 'shield');
                setGs(prev => {
                    const ns = [...prev.shields];
                    if (!ns.length) return { ...prev, gameOver: 'lose' };
                    const c = ns.pop();
                    if (c.text?.toLowerCase().includes("shield trigger")) {
                        setTrigger(c);
                    }
                    else setTimeout(() => setGs(s => ({ ...s, hand: [...s.hand, c] })), 800);
                    return { ...prev, shields: ns };
                });
                toast("Shield broken!", "error");
            }
            if (action === "DECK_OUT" || action === "DIRECT_KILL") { setGs(p => ({ ...p, gameOver: 'win' })); toast("Victory!"); }
            if (action === "CREATURE_DESTROYED") {
                const t = gsR.current.battleZone.find(c => c.instanceId === details.targetId);
                if (t) addLog(`Opponent destroyed your ${t.name}`, 'battle');
                if (t) {
                    triggerEffect("DESTROY_EFFECTS", t);
                    const opt = CardEngine.getOptionalReplacement(t, gsR.current.battleZone);
                    if (opt) {
                        setPendingDestruction({ card: t, replacement: opt });
                    } else {
                        finishDestruction(t);
                    }
                }
                toast("Creature destroyed!", "error");
            }
            if (action === "BOUNCE") { setGs(p => { const count = details?.count || 1; const toReturn = p.battleZone.slice(-count); return { ...p, battleZone: p.battleZone.slice(0, -count), hand: [...p.hand, ...toReturn] }; }); toast("Creatures bounced!", "error"); }
            if (action === "BOUNCE_TARGET") {
                setGs(p => {
                    const t = p.battleZone.find(c => c.instanceId === details.targetId);
                    if (!t) return p;
                    return { ...p, battleZone: p.battleZone.filter(c => c.instanceId !== details.targetId), hand: [...p.hand, t] };
                });
                toast("Creature bounced!", "error");

/* ============ DECK BUILDER ============ */
const DeckBuilder = ({ cards, initialDeck, onSave, onExit }) => {
    const [deck, setDeck] = useState(() => {
        if (!initialDeck) return [];
        const full = [];
        initialDeck.cards.forEach(dc => {
            const info = cards.find(c => c.id === dc.id && c.set_id === dc.set_id);
            if (info) {
                for (let i = 0; i < dc.count; i++) full.push({ ...info, instanceId: Math.random().toString(36).substr(2, 9) });
            }
        });
        return full;
    });
    const [filter, setFilter] = useState("All");
    const [preview, setPreview] = useState(null);
    const [deckName, setDeckName] = useState(initialDeck?.name || "Custom Deck");

    const addCard = (card) => {
        if (deck.length >= 40) return;
        const count = deck.filter(c => c.name === card.name).length;
        if (count >= 4) return;
        setDeck([...deck, { ...card, instanceId: Math.random().toString(36).substr(2, 9) }]);
    };

    const removeCard = (idx) => {
        setDeck(deck.filter((_, i) => i !== idx));
    };

    const filteredCards = filter === "All" ? cards : cards.filter(c => c.civilizations?.includes(filter));

    return (
        <div className="db-layout">
            {preview && <Preview card={preview} />}

            <div className="db-catalog">
                <div className="db-catalog-header">
                    <h2>Card Catalog</h2>
                    <div style={{display:'flex', gap:6}}>
                        {["All", "Light", "Water", "Darkness", "Fire", "Nature"].map(c => (
                            <button key={c} className={`civ-filter-btn ${filter === c ? 'active' : ''}`} onClick={() => setFilter(c)}>{c}</button>
                        ))}
                    </div>
                </div>
                <div className="db-catalog-grid">
                    {filteredCards.map(c => {
                        const count = deck.filter(x => x.name === c.name).length;
                        return (
                            <div key={`${c.set_id}-${c.id}`} className={`card card--md ${count >= 4 ? 'limit-reached' : ''}`}
                                 onClick={() => addCard(c)}
                                 onMouseEnter={() => setPreview(c)}
                                 onMouseLeave={() => setPreview(null)}
                                 style={{cursor: 'pointer'}}>
                                <img src={`./cards/${c.set_id || 'dm-01'}/${c.image_file}`} alt={c.name} />
                                {count > 0 && <div className="power-gem" style={{background:'var(--gold)', color:'black', top: -5, right: -5, bottom: 'auto', borderRadius: '50%', width: 22}}>{count}</div>}
                            </div>
                        );
                    })}
                </div>
            </div>

            <div className="db-deck-pane">
                <div className="db-deck-header">
                    <input value={deckName} onChange={e => setDeckName(e.target.value)}
                           style={{background:'none', border:'none', borderBottom:'1px solid var(--gold)', color:'var(--gold)', font:'inherit', fontWeight:900, width:'100%', outline:'none'}} />
                    <div style={{fontSize:12, marginTop:8, opacity:0.6}}>Cards: {deck.length} / 40</div>
                </div>
                <div className="db-deck-list">
                    {deck.map((c, i) => (
                        <div key={c.instanceId} className="db-deck-card card"
                             onClick={() => removeCard(i)}
                             onMouseEnter={() => setPreview(c)}
                             onMouseLeave={() => setPreview(null)}>
                            <img src={`./cards/${c.set_id}/${c.image_file}`} alt={c.name} />
                        </div>
                    ))}
                </div>
                <div className="db-footer">
                    <button className="btn-primary" onClick={() => onSave({ name: deckName, cards: deck })} disabled={deck.length !== 40}>Save Deck</button>
                    <button className="btn-secondary" onClick={onExit}>Exit</button>
                </div>
            </div>
        </div>
    );
};

/* ============ APP ============ */
const DECKS = [
    { name: "Mono Light: Solar Guardian", color: "Light", cards: [{set_id:"dm-01",id:"9/110",count:4},{set_id:"dm-01",id:"3/110",count:4},{set_id:"dm-01",id:"6/110",count:4},{set_id:"dm-01",id:"S1/110",count:2},{set_id:"dm-02",id:"S1/55",count:2},{set_id:"dm-02",id:"5/55",count:4},{set_id:"dm-02",id:"8/55",count:4},{set_id:"dm-02",id:"7/55",count:4},{set_id:"dm-03",id:"8/55",count:2},{set_id:"dm-03",id:"1/55",count:2},{set_id:"dm-03",id:"11/55",count:4}] },
    { name: "Mono Water: Liquid People", color: "Water", cards: [{set_id:"dm-01",id:"23/110",count:4},{set_id:"dm-01",id:"S3/110",count:2},{set_id:"dm-01",id:"40/110",count:4},{set_id:"dm-01",id:"34/110",count:2},{set_id:"dm-02",id:"14/55",count:4},{set_id:"dm-02",id:"15/55",count:4},{set_id:"dm-02",id:"12/55",count:4},{set_id:"dm-02",id:"21/55",count:4},{set_id:"dm-03",id:"14/55",count:4},{set_id:"dm-03",id:"13/55",count:2},{set_id:"dm-03",id:"S2/55",count:2},{set_id:"dm-03",id:"21/55",count:4}] },
    { name: "Mono Darkness: Demon Scorn", color: "Darkness", cards: [{set_id:"dm-01",id:"63/110",count:4},{set_id:"dm-01",id:"54/110",count:4},{set_id:"dm-01",id:"53/110",count:4},{set_id:"dm-01",id:"S5/110",count:2},{set_id:"dm-01",id:"45/110",count:4},{set_id:"dm-02",id:"24/55",count:4},{set_id:"dm-02",id:"26/55",count:2},{set_id:"dm-02",id:"30/55",count:4},{set_id:"dm-03",id:"S3/55",count:2},{set_id:"dm-03",id:"29/55",count:2},{set_id:"dm-03",id:"26/55",count:4},{set_id:"dm-03",id:"30/55",count:4}] },
    { name: "Mono Fire: Dragon Soul", color: "Fire", cards: [{set_id:"dm-01",id:"69/110",count:2},{set_id:"dm-01",id:"74/110",count:4},{set_id:"dm-01",id:"70/110",count:4},{set_id:"dm-01",id:"73/110",count:4},{set_id:"dm-01",id:"81/110",count:4},{set_id:"dm-02",id:"S4/55",count:2},{set_id:"dm-02",id:"35/55",count:2},{set_id:"dm-02",id:"43/55",count:4},{set_id:"dm-02",id:"42/55",count:2},{set_id:"dm-03",id:"S4/55",count:2},{set_id:"dm-03",id:"40/55",count:4},{set_id:"dm-03",id:"38/55",count:4},{set_id:"dm-03",id:"44/55",count:2}] },
    { name: "Mono Nature: Wild Instinct", color: "Nature", cards: [{set_id:"dm-01",id:"90/110",count:4},{set_id:"dm-01",id:"99/110",count:4},{set_id:"dm-01",id:"S10/110",count:2},{set_id:"dm-01",id:"102/110",count:4},{set_id:"dm-02",id:"S5/55",count:2},{set_id:"dm-02",id:"45/55",count:4},{set_id:"dm-02",id:"53/55",count:4},{set_id:"dm-02",id:"47/55",count:4},{set_id:"dm-03",id:"S5/55",count:2},{set_id:"dm-03",id:"47/55",count:2},{set_id:"dm-03",id:"52/55",count:4},{set_id:"dm-03",id:"54/55",count:4}] }
];

const App = () => {
    const [cards, setCards] = useState([]);
    const [peer, setPeer] = useState(null);
    const [conn, setConn] = useState(null);
    const [isHost, setIsHost] = useState(false);
    const [code, setCode] = useState("");
    const [view, setView] = useState("home");
    const [jc, setJc] = useState("");
    const [loading, setLoading] = useState(true);
    const [selIdx, setSelIdx] = useState(0);
    const [customDecks, setCustomDecks] = useState([]);
    const [editingDeckIdx, setEditingDeckIdx] = useState(null);
    const [toasts, setToasts] = useState([]);

    const toast = (msg, type = "success") => {
        const id = Date.now();
        setToasts(p => [...p, { id, message: msg, type }]);
        setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3000);
    };

    useEffect(() => {
        // Fetch all metadata
        const sets = ["dm-01", "dm-02", "dm-03"];
        Promise.all(sets.map(s => fetch(`./cards/${s}/metadata.json`).then(r => r.json())))
            .then(allSets => {
                setCards(allSets.flat());
                setLoading(false);
            }).catch(() => setLoading(false));

        const p = new Peer();
        p.on('open', id => setCode(id));
        p.on('connection', c => { c.on('open', () => { setConn(c); setIsHost(true); setView("game"); }); });
        setPeer(p);

        // Load custom decks
        const saved = localStorage.getItem("dm_custom_decks");
        if (saved) setCustomDecks(JSON.parse(saved));
    }, []);

    const saveCustomDeck = (deck) => {
        const deckData = {
            name: deck.name,
            color: deck.cards[0]?.civilizations[0] || "Neutral",
            isCustom: true,
            cards: deck.cards.reduce((acc, c) => {
                const existing = acc.find(x => x.id === c.id && x.set_id === c.set_id);
                if (existing) existing.count++;
                else acc.push({ id: c.id, set_id: c.set_id, count: 1 });
                return acc;
            }, [])
        };
        let newDecks;
        if (editingDeckIdx !== null) {
            newDecks = [...customDecks];
            newDecks[editingDeckIdx] = deckData;
        } else {
            newDecks = [...customDecks, deckData];
        }
        setCustomDecks(newDecks);
        localStorage.setItem("dm_custom_decks", JSON.stringify(newDecks));
        setEditingDeckIdx(null);
        setView("home");
    };

    const editDeck = (idx, e) => {
        e.stopPropagation();
        setEditingDeckIdx(idx);
        setView("deckbuilder");
    };

    const deleteDeck = (idx, e) => {
        e.stopPropagation();
        const newDecks = customDecks.filter((_, i) => i !== idx);
        setCustomDecks(newDecks);
        localStorage.setItem("dm_custom_decks", JSON.stringify(newDecks));
        if (selIdx >= DECKS.length + newDecks.length) setSelIdx(0);
    };

    const join = () => { if (!jc.trim() || !peer) return; const c = peer.connect(jc.trim()); c.on('open', () => { setConn(c); setIsHost(false); setView("game"); }); };

    if (loading || !cards.length) return <div className="loading"><div className="ring" /><p>Loading...</p></div>;

    const allDecks = [...DECKS, ...customDecks];

    if (view === "game") {
        return <GameBoard cards={cards} deck={allDecks[selIdx]} conn={conn} isHost={isHost} />;
    }

    if (view === "deckbuilder") {
        return <DeckBuilder cards={cards} initialDeck={editingDeckIdx !== null ? customDecks[editingDeckIdx] : null} onSave={saveCustomDeck} onExit={() => { setView("home"); setEditingDeckIdx(null); }} />;
    }

    return (
        <div className="lobby">
            <div className="toast-layer">
                {toasts.map(t => (
                    <div key={t.id} className={`toast toast--${t.type}`} style={{animation:'toast-in 0.3s ease-out forwards'}}>
                        {t.type === 'error' ? 'âš ï¸' : 'âœ¨'} {t.message}
                    </div>
                ))}
            </div>
            <h1 style={{marginBottom: 20}}>Duel<span>Masters</span></h1>
            <div className="lobby-grid">
                <div className="lobby-panel" style={{gridColumn: 'span 1', display:'flex', flexDirection:'column'}}>
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                        <h2>Select Deck</h2>
                        <button className="btn-secondary" style={{padding:'4px 8px', fontSize:9}} onClick={() => setView("deckbuilder")}>+ New Deck</button>
                    </div>
                    <p className="sub">Standard & Custom</p>
                    <div style={{flex:1, overflowY:'auto', display:'flex', flexDirection:'column', gap:8, marginTop:10, paddingRight:5}}>
                        {allDecks.map((d, i) => (
                            <div key={i} onClick={() => setSelIdx(i)} style={{
                                padding: '12px 16px', borderRadius: 8, cursor: 'pointer', position:'relative',
                                border: `2px solid ${selIdx === i ? 'var(--gold)' : 'rgba(180,130,70,0.1)'}`,
                                background: selIdx === i ? 'rgba(255,214,68,0.1)' : 'rgba(0,0,0,0.2)',
                                transition: 'all 0.2s'
                            }}>
                                <div style={{fontSize:13, fontWeight:900, color: selIdx === i ? 'var(--gold)' : 'var(--cream)'}}>{d.name}</div>
                                <div style={{fontSize:9, opacity:0.5, textTransform:'uppercase'}}>{d.color}</div>
                                {d.isCustom && (
                                    <div style={{position:'absolute', right:10, top:10, display:'flex', gap:10}}>
                                        <button onClick={(e) => editDeck(i - DECKS.length, e)}
                                                style={{background:'none', border:'none', color:'var(--gold)', cursor:'pointer', fontSize:12}}>Edit</button>
                                        <button onClick={(e) => deleteDeck(i - DECKS.length, e)}
                                                style={{background:'none', border:'none', color:'var(--fire)', cursor:'pointer', fontSize:14}}>Ã—</button>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
                <div className="lobby-panel">
                    <h2>Online Duel</h2>
                    <p className="sub">Share code or join</p>
                    <div style={{ marginBottom: 12 }}>
                                <span className="lobby-code" onClick={() => {
                                    if (code) {
                                        if (navigator.clipboard && navigator.clipboard.writeText) {
                                            navigator.clipboard.writeText(code);
                                            toast("Code copied to clipboard!");
                                        } else {
                                            const textArea = document.createElement("textarea");
                                            textArea.value = code;
                                            document.body.appendChild(textArea);
                                            textArea.select();
                                            try {
                                                document.execCommand('copy');
                                                toast("Code copied (fallback)!");
                                            } catch (err) {
                                                alert("Copy failed. Your ID: " + code);
                                            }
                                            document.body.removeChild(textArea);
                                        }
                                    }
                                }} title="Click to copy">
                                    {code || "Generating..."}
                                </span>
                    </div>
                    <div className="join-row">
                        <input className="join-input" placeholder="Opponent's code" value={jc} onChange={e => setJc(e.target.value)} onKeyDown={e => e.key === 'Enter' && join()} />
                        <button className="btn-primary" style={{borderRadius:'0 8px 8px 0', height:'36px', padding:'0 25px'}} onClick={join}>Connect</button>
                    </div>
                </div>
            </div>
        </div>
    );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
