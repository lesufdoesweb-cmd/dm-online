server {
    listen 443;
    server_name dm-online.fun www.dm-online.fun;

    # Path to your built frontend files
    root /var/www/dm-online/dist;
    index index.html;

    # Serve the React App
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Socket.IO Reverse Proxy
    location /socket.io/ {
        proxy_pass http://localhost:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        # Increase timeouts to prevent WebSocket disconnects (5 minutes)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Standard proxy headers
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Ensure metadata.json and images are served correctly from public/cards
    location /cards/ {
        expires 1d;
        add_header Cache-Control "public";
    }
}